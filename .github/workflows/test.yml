name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Unit + Property + Scenario Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate release version contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const src = fs.readFileSync('src/version.js', 'utf8');
          const match = src.match(/export const APP_VERSION\s*=\s*'([^']+)'/);
          if (!match || match[1] !== pkg.version) {
            throw new Error(`Version mismatch: package=${pkg.version}, app=${match?.[1] || 'missing'}`);
          }
          console.log(`Version contract OK: ${pkg.version}`);
          NODE

      - name: Validate certification documentation
        run: npm run certify:docs

      - name: Run tests
        run: npm test

      - name: Run deterministic 90-day certification fixture
        run: npm run certify:longitudinal -- artifacts/certification/longitudinal-90d.json

      - name: Upload certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: actions-tracker-certification-evidence
          path: artifacts/certification/longitudinal-90d.json
          if-no-files-found: error

      - name: Persistence round-trip regression
        run: npm run test:roundtrip -- tests/fixtures/roundtrip-export.json

      - name: Build (smoke test — ensure no import errors)
        run: npm run build
