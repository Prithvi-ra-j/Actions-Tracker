name: Build Android APK

# ─────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────
on:
  push:
    branches:
      - main
  workflow_dispatch:   # allows manual run from the Actions tab

# ─────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────
jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────
      # No .nvmrc found; using Node 20 LTS — compatible with Vite 5 + React 18
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 3. npm cache ──────────────────────────────────────────────────────
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # ── 4. Install dependencies ───────────────────────────────────────────
      - name: Install npm dependencies
        # Health Connect 0.7 declares a Capacitor 5 peer while this app uses
        # Capacitor 6; use the tested compatibility override.
        run: npm install --legacy-peer-deps

      # ── 5. Build web assets ───────────────────────────────────────────────
      - name: Build web app (Vite)
        run: npm run build

      # ── 6. Sync into Android project ──────────────────────────────────────
      - name: Sync web assets into Android (cap sync)
        run: npx cap sync android

      # ── 7. JDK 17 ────────────────────────────────────────────────────────
      # AGP 8.2.1 + Gradle 8.2.1 require JDK 17 (Google's official minimum).
      # JDK 21 is also compatible but 17 is the safest match for this AGP.
      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 8. Gradle cache ───────────────────────────────────────────────────
      # Caches the Gradle wrapper download, caches, and build-script jars.
      # The cache key includes the wrapper properties so a Gradle upgrade
      # automatically invalidates and re-downloads.
      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 9. Make gradlew executable ────────────────────────────────────────
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # ── 10. Build debug APK ───────────────────────────────────────────────
      # Runs assembleDebug which produces a debug-signed APK using the
      # Android SDK's built-in debug keystore (~/.android/debug.keystore).
      # The debug keystore is regenerated by the Android build tools on each
      # fresh runner — see note on signing consistency below.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          # Increase JVM heap; the runner default is sometimes too low for AGP
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"

      # ── 11. Upload APK artifact ───────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Actions-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          # Keep artifacts for 30 days (GitHub's default for public repos is 90)
          retention-days: 30
          if-no-files-found: error   # fail loudly if the APK wasn't produced
