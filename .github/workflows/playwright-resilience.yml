name: Resilience And Longitudinal
on:
  workflow_dispatch:
  schedule: [{cron: '43 3 * * 6'}]
jobs:
  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:resilience
      - run: npx playwright test tests/e2e/long-session tests/e2e/self-validation --project=chromium --workers=1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-evidence
          path: |
            playwright-report/
            test-results/
