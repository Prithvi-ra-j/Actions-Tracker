name: Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.5.1"
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so the changelog step can compare tags
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Health Connect 0.7 declares a Capacitor 5 peer while this app uses
        # Capacitor 6; use the tested compatibility override (matches android-build.yml).
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Determine Android version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.5.0"
            exit 1
          fi

          IFS='.' read -r LEVEL PHASE PATCH <<< "$VERSION"

          if (( LEVEL > 2147 || PHASE > 999 || PATCH > 999 )); then
            echo "Version is outside the supported Android versionCode range."
            exit 1
          fi

          # 1.5.0 -> 1005001, 1.5.1 -> 1005002, etc.
          VERSION_CODE=$((LEVEL * 1000000 + PHASE * 1000 + PATCH))

          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Stamp version.js with release version
        # Replaces APP_VERSION in src/version.js so the baked-in version string
        # inside the APK matches the tag. Runs only in the GitHub runner —
        # nothing is committed back to the repo.
        run: |
          sed -i "s/export const APP_VERSION *= *'[^']*'/export const APP_VERSION = '${{ steps.version.outputs.name }}'/" src/version.js
          echo "Stamped version.js:"
          grep APP_VERSION src/version.js

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          # Find the previous tag to bound the log range.
          # If none exists (first release), use the full history.
          CURRENT_TAG="v${{ steps.version.outputs.name }}"
          # Two-step approach avoids both:
          #   - grep -v exit 1 (no matches) → pipefail kills the step
          #   - head -1 SIGPIPE (exit 141)  → pipefail kills the step
          # Collect all filtered tags into a variable first; head -1 then
          # operates on an echo, not a live pipe, so no SIGPIPE is possible.
          ALL_TAGS=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" || true)
          PREV_TAG=$(echo "$ALL_TAGS" | head -1)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            SINCE_LABEL="since ${PREV_TAG}"
          else
            RANGE="HEAD"
            SINCE_LABEL="(first release)"
          fi

          # One bullet per commit, skip merge commits, cap at 40.
          # --max-count avoids piping into head, which would cause SIGPIPE (exit 141).
          COMMITS=$(git log "$RANGE" \
            --no-merges \
            --max-count=40 \
            --pretty=format:'- %s (%h)')

          if [ -z "$COMMITS" ]; then
            COMMITS="- No individual commits recorded ${SINCE_LABEL}"
          fi

          # Write multiline output using a random heredoc delimiter
          EOF_MARKER=$(openssl rand -hex 8)
          {
            echo "body<<${EOF_MARKER}"
            echo "## What changed ${SINCE_LABEL}"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "---"
            echo "- APK: \`Actions-Tracker-v${{ steps.version.outputs.name }}.apk\`"
            echo "- versionCode: \`${{ steps.version.outputs.code }}\`"
            echo "- Data persists across update — do **not** uninstall"
            echo "${EOF_MARKER}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/actions-tracker-release.keystore"

      - name: Set up JDK 17 (Temurin)
        # AGP 8.2.1 + Gradle 8.2.1 require JDK 17 (matches android-build.yml)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/actions-tracker-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PandroidVersionName="${{ steps.version.outputs.name }}" \
            -PandroidVersionCode="${{ steps.version.outputs.code }}" \
            --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Actions-Tracker-v${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          body: ${{ steps.changelog.outputs.body }}
          files: release/Actions-Tracker-v${{ steps.version.outputs.name }}.apk
