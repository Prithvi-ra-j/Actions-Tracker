name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Determine Android version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.5.0"
            exit 1
          fi

          IFS='.' read -r LEVEL PHASE PATCH <<< "$VERSION"

          if (( LEVEL > 2147483 || PHASE > 999 || PATCH > 999 )); then
            echo "Version component is out of supported range."
            exit 1
          fi

          # Stable integer mapping for Android versionCode.
          VERSION_CODE=$((LEVEL * 1000000 + PHASE * 1000 + PATCH))

          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set Android version
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          path = Path("android/app/build.gradle")
          text = path.read_text()
          text = text.replace('versionCode 1', f'versionCode {os.environ["VERSION_CODE"]}', 1)
          text = text.replace('versionName "1.0"', f'versionName "{os.environ["VERSION_NAME"]}"', 1)
          path.write_text(text)
          PY

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Actions-Tracker-v${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/Actions-Tracker-v${{ steps.version.outputs.name }}.apk
